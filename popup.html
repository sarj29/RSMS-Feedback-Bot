<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>RSMS Feedback Assistant</title>
  <style>
    body {
      width: 290px;
      padding: 14px;
      font-family: Arial, sans-serif;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
    }

    #fill {
      background: #1677ff;
      color: #fff;
    }

    #submit {
      background: #555;
      color: #fff;
    }

    #all {
      background: #168a45;
      color: #fff;
    }

    #stop {
      background: #c62828;
      color: #fff;
    }

    .note {
      margin-top: 10px;
      font-size: 11px;
      color: #666;
    }

    #startCourseFeedback {
      background: #1677ff;
      color: #fff;
    }

    #stopCourseFeedback {
      background: #c62828;
      color: #fff;
    }
  </style>
</head>

<body>
  <h2>RSMS Feedback Assistant</h2>

  <h3>Semester Feedback</h3>
  <button id="fill">Fill Current Subject</button>
  <button id="submit">Submit Current Subject</button>
  <button id="all">Run All Subjects</button>
  <button id="stop">Stop Automation</button>
  <div class="note">
    “Fill” selects the first radio option in each question and puts a single
    space in both required textareas.
  </div>

  <hr>

  <h3>Course Feedback</h3>
  <button id="startCourseFeedback">Run Course Feedback</button>
  <button id="stopCourseFeedback">Stop Automation</button>
  <div class="note">
    Selects the first radio option in each question of the selected subject.
  </div>
  <script src="popup.js"></script>
</body>

</html>
